[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "redmi9a-toolkit"
version = "0.1.0"
description = "Audited Android GSI workflows for the Redmi 9A, with explicit compatibility gates"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
redmi9a = "redmi9a.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.14.4", "bandit==1.8.6", "mypy==1.18.2"]
mtk = ["pyusb", "pycryptodome", "pycryptodomex", "colorama", "pyserial", "mfusepy"]

[tool.setuptools.packages.find]
include = ["redmi9a*"]

[tool.setuptools.package-data]
redmi9a = ["profiles/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
